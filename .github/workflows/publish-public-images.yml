name: Publish Public Docker Images & Offline Release Bundle

on:
  push:
    branches:
      - release-artifacts
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/alishz66/ibshop-deploy
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

jobs:
  publish-api:
    name: Publish Public Backend API Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release Artifacts
        uses: actions/checkout@v4
        with:
          ref: release-artifacts

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Public cms-api Image
        run: |
          VER=$(sed -n '1p' version.txt | tr -d '\r\n')
          RDATE=$(sed -n '2p' version.txt | tr -d '\r\n')
          cat << 'EOF' > Dockerfile.api
          FROM mcr.microsoft.com/dotnet/aspnet:10.0-alpine
          LABEL org.opencontainers.image.source="https://github.com/alishz66/ibshop-deploy"
          LABEL org.opencontainers.image.description="iBshop Enterprise CMS & Cart Backend API (.NET 10)"
          WORKDIR /app
          RUN apk add --no-cache icu-libs icu-data-full tzdata curl
          ARG APP_VERSION
          ARG RELEASE_DATE
          ENV DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false \
              TZ=Asia/Tehran \
              ASPNETCORE_URLS=http://+:8080 \
              ASPNETCORE_ENVIRONMENT=Production \
              IBSHOP_VERSION=${APP_VERSION} \
              IBSHOP_RELEASE_DATE=${RELEASE_DATE}
          COPY artifacts/api/ ./
          COPY ["artifacts/snapshots/", "./docs/newest docs/ibshop_10_products_req_resp/"]
          EXPOSE 8080
          ENTRYPOINT ["dotnet", "iBshop.Api.dll"]
          EOF
          docker build --provenance=false -f Dockerfile.api \
            --build-arg APP_VERSION="${VER}" \
            --build-arg RELEASE_DATE="${RDATE}" \
            -t "${IMAGE_PREFIX}/cms-api:${VER}" \
            -t "${IMAGE_PREFIX}/cms-api:v0.1.3-20261109.4" \
            -t "${IMAGE_PREFIX}/cms-api:latest" .
          for TAG in "${VER}" "v0.1.3-20261109.4" "latest"; do
            docker push "${IMAGE_PREFIX}/cms-api:${TAG}"
          done

  publish-portal:
    name: Publish Public Web Portal SSR Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release Artifacts
        uses: actions/checkout@v4
        with:
          ref: release-artifacts

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Public web-portal Image
        run: |
          VER=$(sed -n '1p' version.txt | tr -d '\r\n')
          cat << 'EOF' > Dockerfile.portal
          FROM node:22-alpine
          LABEL org.opencontainers.image.source="https://github.com/alishz66/ibshop-deploy"
          LABEL org.opencontainers.image.description="iBshop Public Web Portal (Angular 22 SSR)"
          WORKDIR /app
          RUN apk add --no-cache tzdata curl
          ARG APP_VERSION
          ENV NODE_ENV=production \
              PORT=4000 \
              TZ=Asia/Tehran \
              NG_ALLOWED_HOSTS="*" \
              SSR_API_URL="http://cms-api:8080" \
              IBSHOP_VERSION=${APP_VERSION}
          COPY artifacts/web-portal/ ./dist/apps/web-portal/
          EXPOSE 4000
          CMD ["node", "dist/apps/web-portal/server/server.mjs"]
          EOF
          docker build --provenance=false -f Dockerfile.portal \
            --build-arg APP_VERSION="${VER}" \
            -t "${IMAGE_PREFIX}/web-portal:${VER}" \
            -t "${IMAGE_PREFIX}/web-portal:v0.1.3-20261109.4" \
            -t "${IMAGE_PREFIX}/web-portal:latest" .
          for TAG in "${VER}" "v0.1.3-20261109.4" "latest"; do
            docker push "${IMAGE_PREFIX}/web-portal:${TAG}"
          done

  publish-admin:
    name: Publish Public Admin Panel SPA Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release Artifacts
        uses: actions/checkout@v4
        with:
          ref: release-artifacts

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Public admin-panel Image
        run: |
          VER=$(sed -n '1p' version.txt | tr -d '\r\n')
          cat << 'EOF' > Dockerfile.admin
          FROM nginx:1.27-alpine
          LABEL org.opencontainers.image.source="https://github.com/alishz66/ibshop-deploy"
          LABEL org.opencontainers.image.description="iBshop CMS Admin Panel (Angular 22 SPA)"
          RUN apk add --no-cache tzdata curl
          ENV TZ=Asia/Tehran
          COPY artifacts/admin-spa.conf /etc/nginx/conf.d/default.conf
          COPY artifacts/admin-panel/ /usr/share/nginx/html/
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          EOF
          docker build --provenance=false -f Dockerfile.admin \
            -t "${IMAGE_PREFIX}/admin-panel:${VER}" \
            -t "${IMAGE_PREFIX}/admin-panel:v0.1.3-20261109.4" \
            -t "${IMAGE_PREFIX}/admin-panel:latest" .
          for TAG in "${VER}" "v0.1.3-20261109.4" "latest"; do
            docker push "${IMAGE_PREFIX}/admin-panel:${TAG}"
          done

  publish-release:
    name: Verify Anonymous Pull & Publish Offline Release Bundle
    needs: [publish-api, publish-portal, publish-admin]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Release Artifacts Metadata
        uses: actions/checkout@v4
        with:
          ref: release-artifacts
          sparse-checkout: |
            version.txt

      - name: Read Version Metadata
        id: meta
        run: |
          VERSION=$(sed -n '1p' version.txt | tr -d '\r\n')
          RDATE=$(sed -n '2p' version.txt | tr -d '\r\n')
          JDATE=$(sed -n '3p' version.txt | tr -d '\r\n')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "release_date=${RDATE}" >> $GITHUB_OUTPUT
          echo "jalali_date=${JDATE}" >> $GITHUB_OUTPUT

      - name: Verify Zero-Auth Anonymous Pull & Create Offline Archive
        run: |
          VER="${{ steps.meta.outputs.version }}"
          docker logout ghcr.io || true
          docker pull "${IMAGE_PREFIX}/cms-api:${VER}"
          docker pull "${IMAGE_PREFIX}/web-portal:${VER}"
          docker pull "${IMAGE_PREFIX}/admin-panel:${VER}"
          docker pull redis:7-alpine
          docker pull nginx:1.27-alpine
          docker save \
            "${IMAGE_PREFIX}/cms-api:${VER}" \
            "${IMAGE_PREFIX}/web-portal:${VER}" \
            "${IMAGE_PREFIX}/admin-panel:${VER}" \
            redis:7-alpine \
            nginx:1.27-alpine | gzip > "ibshop-images-${VER}.tar.gz"
          ls -lh "ibshop-images-${VER}.tar.gz"

      - name: Publish Public GitHub Release on ibshop-deploy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          target_commitish: main
          name: "Release ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.jalali_date }})"
          body: |
            ### پکیج استقرار نسخه `${{ steps.meta.outputs.version }}`
            - **تاریخ انتشار:** `${{ steps.meta.outputs.jalali_date }}` (`${{ steps.meta.outputs.release_date }}`)
            - **روش ۱ (سرور دارای اینترنت — کاملاً عمومی و بدون نیاز به لاگین):**
              ```bash
              git pull
              chmod +x deploy.sh
              ./deploy.sh
              ```
            - **روش ۲ (سرور آفلاین بدون اینترنت):**
              فایل `ibshop-images-${{ steps.meta.outputs.version }}.tar.gz` پیوست‌شده را دانلود کرده و در پوشه پروژه قرار دهید:
              ```bash
              chmod +x deploy.sh
              ./deploy.sh ${{ steps.meta.outputs.version }}
              ```
          files: |
            ibshop-images-${{ steps.meta.outputs.version }}.tar.gz
