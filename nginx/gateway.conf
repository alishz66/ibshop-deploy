# =============================================================================
# 1. Public Web Portal + Unified /api & /swagger Reverse Proxy (Port 80 -> Host 8080)
# =============================================================================
server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Route /api, /swagger, /openapi to .NET 10 Backend API
    location ~ ^/(api|swagger|openapi)(/|$) {
        proxy_pass http://cms-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Route all other traffic to Angular 22 SSR Web Portal (Node 22 Express)
    location / {
        proxy_pass http://web-portal:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# =============================================================================
# 2. CMS Admin Panel + Unified /api & /swagger Reverse Proxy (Port 81 -> Host 8081)
# =============================================================================
server {
    listen 81;
    server_name _;
    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Route /api, /swagger, /openapi on the Admin port directly to .NET 10 Backend API
    # (Ensures Same-Origin cookies work on any IP/domain without CORS issues!)
    location ~ ^/(api|swagger|openapi)(/|$) {
        proxy_pass http://cms-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Route all other requests to Angular 22 Admin Panel static container
    location / {
        proxy_pass http://admin-panel:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
